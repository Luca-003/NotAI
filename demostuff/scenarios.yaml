# NotAI - scenari demo per testare il flow notarile end-to-end.
#
# I dati sono FITTIZI. CF e P.IVA sono generati con algoritmo standard
# (validi nella forma ma non riferiti a persone reali). Indirizzi e
# nomi sono inventati o di pura fantasia.
#
# Ogni scenario produce: 1 pratica + 1 atto + N parti + workflow input
# pronto per essere avviato dal notaio nella UI.

scenarios:
  # ---------------------------------------------------------------------
  - id: compravendita-prima-casa
    label: "Compravendita prima casa - appartamento Milano"
    practice:
      code: "2026/0101"
      kind: "notarile.compravendita.immobiliare"
      title: "Rossi-Bianchi - compravendita appartamento Via Garibaldi 12, Milano"
      description: >-
        Compravendita di unita' immobiliare residenziale categoria A/2 sita in
        Milano, Via Garibaldi 12, scala A interno 4. Acquisto prima casa
        agevolato. Trasferimento libero da pesi.
    act:
      kind: "notarile.compravendita.immobiliare"
      title: "Atto di compravendita immobiliare prima casa"
    workflow_input:
      template_id: "notarile.compravendita.immobiliare:v1"
      base_imponibile: 285000
      is_prima_casa: true
      parties:
        - role: "venditore"
          kind: "PF"
          fiscal_code: "RSSMRA70A01F205X"
          anagrafica:
            nome: "Mario"
            cognome: "Rossi"
            data_nascita: "1970-01-01"
            luogo_nascita: "Milano (MI)"
            indirizzo: "Via Garibaldi 12, 20121 Milano"
        - role: "acquirente"
          kind: "PF"
          fiscal_code: "BNCLCA85B05H501Y"
          anagrafica:
            nome: "Luca"
            cognome: "Bianchi"
            data_nascita: "1985-02-05"
            luogo_nascita: "Roma (RM)"
            indirizzo: "Viale Monza 88, 20127 Milano"
    expected_outcome:
      tax_total_eur: 5800       # registro 2% di 285k + ipo 50 + cat 50
      audit_events_min: 6        # workflow.started + 2 visure + draft + tax + human_task.opened

