      description: >-
        Donazione di unita' immobiliare cat. A/3 sita in Roma, Via dei Fori 10.
        Donante e donatario in linea retta (genitore -> figlio maggiorenne).
    act:
      kind: "notarile.donazione"
      title: "Atto di donazione immobiliare"
    workflow_input:
      template_id: "notarile.donazione:v1"
      base_imponibile: 180000
      is_prima_casa: false
      parties:
        - role: "donante"
          kind: "PF"
          fiscal_code: "VRDGPP55C15H501W"
          anagrafica:
            nome: "Giuseppe"
            cognome: "Verdi"
            data_nascita: "1955-03-15"
            luogo_nascita: "Roma (RM)"
            indirizzo: "Via dei Fori 10, 00184 Roma"
        - role: "donatario"
          kind: "PF"
          fiscal_code: "VRDNDR90D20H501T"
          anagrafica:
            nome: "Andrea"
            cognome: "Verdi"
            data_nascita: "1990-04-20"
            luogo_nascita: "Roma (RM)"
            indirizzo: "Via dei Fori 10, 00184 Roma"
    expected_outcome:
      audit_events_min: 6

  # ---------------------------------------------------------------------
  - id: costituzione-srl
    label: "Costituzione SRL con socio unico"
    practice:
      code: "2026/0103"
      kind: "notarile.costituzione_srl"
      title: "Acme Tech SRL - costituzione societaria"
      description: >-
        Costituzione di societa' a responsabilita' limitata unipersonale.
        Capitale sociale 15.000 EUR interamente sottoscritto e versato.
        Oggetto: sviluppo software e consulenza IT.
    act:
      kind: "notarile.costituzione_srl"
      title: "Atto costitutivo SRL"
    workflow_input:
      template_id: "notarile.costituzione_srl:v1"
      base_imponibile: 15000
      is_prima_casa: false
      parties:
        - role: "socio_unico"
          kind: "PF"
          fiscal_code: "FRRGPP82E18F205Q"
          anagrafica:
            nome: "Giuseppe"
            cognome: "Ferrari"
            data_nascita: "1982-05-18"
            luogo_nascita: "Milano (MI)"
            indirizzo: "Via Manzoni 45, 20121 Milano"
        - role: "societa_costituenda"
          kind: "PG"
          vat: "12345678901"
          anagrafica:
            denominazione: "Acme Tech SRL"
            sede_legale: "Via Manzoni 45, 20121 Milano"
            capitale_sociale: 15000
            oggetto: "Sviluppo software, consulenza IT, formazione tecnica"
