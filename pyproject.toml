[project]
name = "notai"
version = "0.1.0"
description = "Piattaforma di automazione per studi notarili e legali italiani"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "NotAI" }]

dependencies = [
  # Web / API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "python-multipart>=0.0.12",

  # DB / migrations
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",

  # Workflow
  "temporalio>=1.7",

  # Storage / search
  "minio>=7.2",
  "opensearch-py>=2.7",
  "qdrant-client>=1.12",

  # AI / RAG
  "llama-index>=0.12",
  "llama-index-vector-stores-qdrant>=0.4",
  "llama-index-llms-openai-like>=0.3",
  "litellm>=1.50",
  "outlines>=0.1",
  "tiktoken>=0.8",

  # Documents
  "python-docx>=1.1",
  "jinja2>=3.1",
  "pypdf>=5.1",
  "pdfplumber>=0.11",

  # RPA / Browser automation
  "playwright>=1.48",

  # Crypto / signing
  "cryptography>=43",
  "asn1crypto>=1.5",
  "rfc3161-client>=0.1",

  # Identity / auth
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",

  # Observability
  "structlog>=24.4",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28",

  # Misc
  "tenacity>=9.0",
  "orjson>=3.10",
  "python-dateutil>=2.9",
  "babel>=2.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-python-dateutil",
  "faker>=30",
  "respx>=0.21",
]

test-e2e = [
  "playwright>=1.48",
  "pytest-playwright>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notai", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC", "RUF"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"migrations/**" = ["N"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
